<section class="form-card-container">
  <!-- CAPA 1: DELIMITACIÓN -->
  <div class="form-card-border">
    <!-- CAPA 2: DEGRADADO -->
    <div class="form-card-gradient">
      <!-- CAPA 3: FORMULARIO -->
      <div class="form-card-content">
        <section id="controls">
          <div class="row">
            <div class="col-12 col-md-4">
              <div class="form-group mb-4">
                <label style="font-weight: bold" class="text-black"
                  >Ordenar por:</label
                >
                <select class="form-control">
                  <option value="" selected disabled>Seleccione</option>
                  <option value="cliente">Cliente</option>
                  <option value="direccion">Dirección</option>
                  <option value="fecha">Fecha</option>
                  <option value="fechaModificacion">Fecha Modificación</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="sortable">#</th>
                <th class="sortable">Identificador</th>
                <th class="sortable text-center" colspan="2">Producto</th>
                <th class="sortable">Categoría</th>
                <th class="sortable">Precio Unitario</th>
                <th class="sortable">Cantidad</th>
                <th class="sortable">Condición</th>
                <th class="sortable">Status</th>
                <th></th>
              </tr>
            </thead>

            <tbody class="text-center">
              <tr *ngFor="let inv of inventarioPaginado; index as i">
                <td class="text-center">
                  {{ (paginaActual - 1) * registrosPorPagina + i + 1 }}
                </td>
                <td>{{ inv.identificadorRegistro }}</td>
                <td>
                  <img
                    *ngIf="inv.imagenes?.length"
                    [src]="inv.imagenes[0]"
                    alt="Imagen del producto"
                    class="imagen-inventario"
                  />
                </td>
                <td>{{ inv.producto }}</td>
                <td>{{ inv.categoria }}</td>
                <td>$ {{ inv.precio }} MXN</td>
                <td>{{ inv.cantidad }}</td>
                <td>
                  <span
                    class="badge"
                    [ngClass]="{
                      nuevo: inv.condicion === 'Nuevo',
                      excelente: inv.condicion === 'Excelente',
                      muyBueno: inv.condicion === 'Muy Bueno',
                      bueno: inv.condicion === 'Bueno',
                    }"
                  >
                    {{ inv.condicion }}
                  </span></td>
                <td>
                  <span
                    class="badge"
                    [ngClass]="{
                      disponible: inv.existencia === 'Disponible',
                      agotado: inv.existencia === 'Agotado',
                      reservado: inv.existencia === 'Reservado',
                      noDisponible: inv.existencia === 'No Disponible',
                    }"
                  >
                    {{ inv.existencia }}
                  </span>
                </td>

                <td>
                  <button
                    class="btn btn-link text-body-tertiary p-0"
                    title="Editar"
                  >
                    <i class="bi bi-pencil-square fs-5"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-container">
          <!-- Anterior -->
          <button
            class="page-dot"
            (click)="paginaAnterior()"
            [disabled]="paginaActual === 1"
          >
            &lt;&lt;
          </button>

          <!-- Páginas -->
          <button
            class="page-dot"
            *ngFor="let page of paginasVisibles"
            [class.active]="paginaActual === page"
            (click)="cambiarPagina(page)"
          >
            {{ page }}
          </button>

          <!-- Siguiente -->
          <button
            class="page-dot"
            (click)="paginaSiguiente()"
            [disabled]="paginaActual === totalPaginas"
          >
            &gt;&gt;
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
