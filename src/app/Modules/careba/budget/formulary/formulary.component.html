<section class="form-card-container">
  <!-- CAPA 1: DELIMITACIÓN -->
  <div class="form-card-border">
    <!-- CAPA 2: DEGRADADO -->
    <div class="form-card-gradient">
      <!-- CAPA 3: FORMULARIO -->
      <div class="form-card-content">
        <form [formGroup]="formCotizaciones" (ngSubmit)="enviarCotizaciones()">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold m-0 text-black">Datos del Cliente</h4>

            <div class="d-flex align-items-center gap-2">
              <label for="fecha" class="fw-bold text-black mb-0">
                Fecha:
              </label>

              <input type="date" id="fecha" class="form-control" formControlName="fecha" />
            </div>
          </div>

          <div class="col-md-12 mb-3">
            <div class="cliente-card">
              <!-- STATUS -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <div class="col-md-7 mb-3">
                    <mat-form-field appearance="fill" class="status-select">
                      <mat-select formControlName="statusProceso">
                        <mat-label>Status</mat-label>
                        <mat-option value="Nuevo"> Nuevo </mat-option>

                        <mat-option value="PasandoExcel">
                          Pasando de Excel
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
              </div>

              <!-- CLIENTE + OBRA -->
              <div class="row align-items-end">
                <!-- CLIENTE -->
                <div class="col-md-7 mb-3">
                  <input type="text" class="form-control input-line" placeholder="Nombre del Cliente"
                    formControlName="cliente" />
                </div>

                <!-- OBRA -->
                <div class="col-md-5 mb-3">
                  <input type="text" class="form-control input-line" placeholder="Obra" formControlName="obra" />
                </div>
              </div>

              <!-- DIRECCIÓN -->
              <div class="row">
                <div class="col-md-12 mb-3">
                  <input type="text" class="form-control input-line" placeholder="Dirección"
                    formControlName="direccion" />
                </div>
              </div>
            </div>
          </div>

          <!-- CONCEPTOS -->
          <div formArrayName="conceptos">
            <div *ngFor="let item of conceptos.controls; let i = index" [formGroupName]="i"
              class="border rounded p-3 mb-3">
              <div class="mb-3">
                <label class="fw-bold">Concepto</label>
                <textarea class="form-control input-line" formControlName="concepto" rows="1">
                </textarea>
              </div>

              <div class="row">
                <div class="col-md-4 mb-3">
                  <label class="fw-bold">Cantidad</label>
                  <input type="number" class="form-control input-line text-center" formControlName="cantidad"
                    (input)="calcularImporte(i)" />
                </div>

                <div class="col-md-4 mb-3">
                  <label class="fw-bold">Precio Unitario</label>

                  <div class="input-money">
                    <span>$</span>

                    <input type="text" class="form-control input-line text-center" formControlName="precioUnitario"
                      inputmode="decimal" (input)="calcularImporte(i)" (blur)="formatearPrecio(i)" />
                  </div>
                </div>

                <div class="col-md-4 mb-3">
                  <label class="fw-bold">Importe</label>

                  <div class="input-money">
                    <span>$</span>

                    <input type="text" class="form-control input-line text-center" [value]="
        conceptos.at(i).get('importe')?.value
          | number:'1.2-2'
      " readonly />
                  </div>
                </div>
              </div>

              <button type="button" class="btn btn-danger btn-sm" (click)="eliminarConcepto(i)"
                *ngIf="conceptos.length > 1">
                Eliminar
              </button>
            </div>

            <div class="d-flex justify-content-end mt-2 mb-3">
              <button type="button" class="btn btn-outline-primary btn-enviar btn-sm" (click)="agregarConcepto()">
                + Agregar concepto
              </button>
            </div>
          </div>

          <div class="row">
            <div class="col-md-7 mb-3">
              <label class="fw-bold">NOTAS</label>
              <textarea class="form-control input-line" formControlName="notas" rows="1">
              </textarea>
            </div>

            <div class="col-md-5">

              <!-- ========================= -->
              <!-- SUBTOTAL E IVA -->
              <!-- ========================= -->

              <div class="border rounded">

                <!-- SUBTOTAL -->
                <div class="mb-3 p-2">

                  <label class="fw-bold">
                    Subtotal
                  </label>

                  <div class="input-money">

                    <span>$</span>

                    <input type="text" class="form-control text-end input-line" [value]="
            (formCotizaciones.get('subtotal')?.value || 0)
              | number:'1.2-2'
          " readonly />

                  </div>

                </div>


                <!-- IVA -->
                <div class="mb-3 p-2">

                  <label class="fw-bold">
                    IVA
                  </label>

                  <div class="input-money">

                    <span>$</span>

                    <input type="text" class="form-control text-end input-line" [value]="
            (formCotizaciones.get('iva')?.value || 0)
              | number:'1.2-2'
          " readonly />

                  </div>

                </div>

              </div>


              <!-- ========================= -->
              <!-- TOTAL -->
              <!-- ========================= -->

              <div class="mb-3 border rounded p-2">

                <label class="fw-bold">
                  Total
                </label>

                <div class="input-money">

                  <span>$</span>

                  <input type="text" class="form-control text-end fw-bold input-line" [value]="
          (formCotizaciones.get('total')?.value || 0)
            | number:'1.2-2'
        " readonly />

                </div>

              </div>

            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-3">
            <button class="btn btn-primary btn-enviar">Enviar</button>
            <button type="button" class="btn btn-primary btn-enviar" (click)="onGeneratePDF()">
              Generar PDF
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>


@if (mostrarModalExito) {
  <div class="modal-overlay">
    <div class="modal-exito text-black">
      <div class="modal-icono modal-icono-exito">
        <i class="bi bi-check-lg"></i>
      </div>

      <h2>¡Éxito!</h2>

      <p>{{ mensajeExito }}</p>

      <button
        type="button"
        class="btn-modal btn-modal-aceptar"
        (click)="cerrarModalExito()"
      >
        Aceptar
      </button>
    </div>
  </div>
}
