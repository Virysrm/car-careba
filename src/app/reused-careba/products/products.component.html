<section id="products" class="section-header">
  <div class="linea-encabezado"></div>
  <div class="section-content">
    <h1 class="section-title lexend-zetta text-center">Nuestros Muebles</h1>
    <h5 class="font-urbanist section-subtitle text-center">
      Ofrecemos una selección de muebles de calidad
    </h5>
  </div>
</section>

<section class="section-contenido mb-5 products">
  <div class="grid-productos">
    <div class="card-producto" *ngFor="let p of paginatedProducts">
      <div class="card-img">
        <span
          class="tag-estado"
          [ngClass]="{
            'tag-estado-disponible': p.existencia === 'Disponible',
            'tag-estado-no-disponible': p.existencia !== 'Disponible',
          }"
        >
          {{ p.existencia || "Sin estado" }}
        </span>

        <img
          *ngIf="p.imagenes?.length"
          [src]="p.imagenes[0]"
          [alt]="p.producto"
        />
      </div>

      <div class="card-body">
        <div class="titulo-precio">
          <h2>{{ p.producto }}</h2>
          <span class="precio text-black">${{ p.precio }} MXN</span>
        </div>

        <p class="categoria"><strong>Condición:</strong> {{ p.condicion }}</p>

        <p class="categoria"><strong>Cantidad:</strong> {{ p.cantidad }}</p>

        <p class="categoria" *ngIf="p.medidas">
          <strong>Medidas:</strong> {{ p.medidas }}
        </p>

        <ul class="descripcion" *ngIf="p.descripcion">
          <li *ngFor="let detalle of separarDescripcion(p.descripcion)">
            {{ detalle }}
          </li>
        </ul>

        <a
          class="btn-consultar topbar-item whatsapp"
          [href]="
            'https://wa.me/525527204407?text=' +
            encodeURIComponent('Hola, me interesa el mueble: ' + p.producto + '.' + ' Me gustaría más información, por favor.')
          "
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="bi bi-whatsapp"></i>
          <span>Consultar</span>
        </a>
      </div>
    </div>

    <!-- ↓↓↓ MOVER LA PAGINACIÓN AQUÍ ↓↓↓ -->
    <nav *ngIf="totalPages > 1" aria-label="Paginación" class="paginacion">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a
            class="page-link"
            style="color: #1e3a47"
            (click)="goToPage(currentPage - 1)"
            >Anterior</a
          >
        </li>

        <li
          class="page-item"
          *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1"
        >
          <a
            class="page-link"
            style="color: #dd9157"
            (click)="goToPage(i + 1)"
            >{{ i + 1 }}</a
          >
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a
            class="page-link"
            style="color: #1e3a47"
            (click)="goToPage(currentPage + 1)"
            >Siguiente</a
          >
        </li>
      </ul>
    </nav>
  </div>
</section>
